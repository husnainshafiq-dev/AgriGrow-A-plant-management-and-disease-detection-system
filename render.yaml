services:
  # -------------------------------------------------------------
  # 1. AgriGrow Backend API Server (Node.js + Express + MongoDB)
  # -------------------------------------------------------------
  - type: web
    name: agrigrow-api
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 7d
      - key: CLIENT_URL
        sync: false
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: agrigrow-ml
          property: host
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false

  # -------------------------------------------------------------
  # 2. AgriGrow ML Microservice (FastAPI + ONNX Runtime)
  # -------------------------------------------------------------
  - type: web
    name: agrigrow-ml
    runtime: python
    plan: free
    region: oregon
    rootDir: ml-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
